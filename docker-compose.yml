# Local stacks.
#   Demo (no external services, seeded data):   docker compose --profile demo up --build
#   Full stack (Postgres + ClamAV + API + worker): docker compose --profile full up --build
# Production runs on managed Postgres with TLS 1.3 (ssl_min_protocol_version=TLSv1.3,
# sslmode=verify-full) and customer-managed AES-256 storage keys.
services:
  demo:
    profiles: ["demo"]
    build: .
    environment:
      SENTINEL_ENV: dev
    ports: ["127.0.0.1:8000:8000"]   # never bind to 0.0.0.0

  postgres:
    profiles: ["full"]
    image: postgres:16.4
    environment:
      POSTGRES_USER: sentinel_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: sentinel
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data

  clamav:
    profiles: ["full"]
    image: clamav/clamav:1.4.1
    volumes: [clamsock:/run/clamav]

  api:
    profiles: ["full"]
    build: .
    env_file: [.env]          # see docs/deployment.md for every variable
    depends_on: [postgres, clamav]
    volumes: [clamsock:/run/clamav, blobs:/data/blobs, sanctions:/data/sanctions, customs:/data/customs-outbox]
    ports: ["127.0.0.1:8000:8000"]

  worker:
    profiles: ["full"]
    build: .
    command: ["python", "-m", "sentinel.worker"]
    env_file: [.env]
    depends_on: [postgres, clamav]
    volumes: [clamsock:/run/clamav, blobs:/data/blobs, sanctions:/data/sanctions, customs:/data/customs-outbox]

volumes:
  pgdata:
  clamsock:
  blobs:
  sanctions:
  customs:
