[project]
name = "trade-lane-sentinel"
version = "0.1.0"
description = "Trade-Lane Sentinel: cross-border compliance & document discrepancy reconciliation kernel"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "cryptography>=42",
    "anthropic>=2.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8",
    "pypdf>=5",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "psycopg[binary]>=3.1"]

[project.scripts]
sentinel-worker = "sentinel.worker:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
