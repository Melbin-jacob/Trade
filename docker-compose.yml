# Local development only. Production uses managed Postgres with TLS 1.3
# (ssl_min_protocol_version=TLSv1.3) and customer-managed AES-256 storage keys.
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: sentinel_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your shell or .env}
      POSTGRES_DB: sentinel
    ports:
      - "127.0.0.1:5432:5432"   # never bind to 0.0.0.0
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
